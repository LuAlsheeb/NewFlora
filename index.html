<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <title>Flora </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0; /* Removes the default outer spacing */
            padding: 0; /* Removes the default inner spacing */
            box-sizing: border-box; /* Ensures that padding and border are included in the element's total size */
        }
        /* Default main Colors in index page */
        :root {
            --cream: #faf6f0;
            --pink: #b66f80;
            --dark: #593d45;
            --muted: #927b7d;
            --border: #eadbd7;
        }
        /*General Style for index page*/
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--cream);
            color: var(--dark);
        }
        .navbar {
            display: flex;/*arranges items in a row */
            justify-content: space-between;/*Space between items */
            align-items: center;/*Center items in a vertical */
            padding: 22px 8%;/*add inner spacing */
        }
        .logo {
            font-family: Georgia, serif;/*Sets the font  */
            font-size: 42px;/*Sets the text size */
            color: #9b6c75;/*Sets the text color */
        }
        .nav-note {
            color: var(--muted); /*Sets the text color */
            font-size: 13px; /*Sets the text size */
        }
        /* Main layout */
        .container {
            width: 85%;/*Sets the width */
            max-width: 1050px;/*limits the maximum width */
            min-height: 590px;/*limits the minimum height */
            margin: 25px auto 35px;/*adds outer spacing */
            display: grid; /*uses Grid layout */
            grid-template-columns: 1fr 1fr;/*Creates two equal columns */
            background: white;/*Sets the background color */
        }
        /* Welcome side */
        .welcome {
            background: #f0e2df;/*Sets the background color */
            padding: 55px 40px;/*adds inner spacing */
            display: flex;/*arranges items in a row */
            flex-direction: column;/*arranges items in a vertical */
            justify-content: center;/*Centers items in a vertical */
            position: relative;/*Sets the position relative to its normal position */
            overflow: hidden;/*hides  content outside the section */
        }

        .welcome h1 {
            font-family: 'IBM Plex Sans Arabic', sans-serif;/*Sets the font */
            font-size: 43px;/*Sets the heading size */
            line-height: 1.8;/*Sets the space between lines */
            color: var(--dark);/*Sets the text color */
        }
    
        .flower-mark {
            position: absolute;/* position the flower inside welcome section section */
            bottom: -65px;/* moves the flower down */
            left: -30px;/* moves the flower to the left */
            font-size: 230px;/*Sets the flower size */
            line-height: 1;/*Sets the space between lines */
            color: #d7b4b2;/*Sets the flower color */
            opacity: 0.45;/*Sets the flower transparency */
        }

        /* Form side */
        .form-section {
            padding: 45px 42px; /*adds inner spacing */
            display: flex;/*arranges items in a row */
            flex-direction: column;/*arranges items in a vertical */
            justify-content: center;/*Centers items in a vertical */
        }

        .form-heading {
            margin-bottom: 25px;/*adds space below the heading */
        }

        .form-heading h2 {
            font-size: 27px;/*Sets the heading size */
        }


        .form-tabs {
            display: flex;/*arranges items in a row */
            gap: 25px; /*adds space between the tabs */
            margin-bottom: 25px;/*adds space below the tabs */
        }

        .tab {
            padding: 0 0 12px; /*adds inner spacing */
            font-family: inherit;/*Sets the font */
            font-size: 14px;/*Sets the text size */
            font-weight: 600;/*Sets the text weight as bold */
            color: #aa9999;/*Sets the text color */
            border: none;  /*Removes the border */
            border-bottom: 2px solid transparent;/*Removes the border */
            background: transparent;/*Removes the background */
        }
        
        .tab.active {
            color: var(--pink);/*Sets the text color */
            border-bottom-color: var(--pink);/*Sets the border color */
        }

        form {
            display: flex;/*arranges items in a row */
            flex-direction: column; /*arranges items in a vertical */
        }

        .field {
            display: flex;/*arranges items in a row */
            flex-direction: column;/*arranges items in a vertical */
            gap: 7px;/*adds space between the fields */
            margin-bottom: 17px;/*adds space below the fields */
        }

        .field label {
            font-size: 12px;/*Sets the label size */
            font-weight: 600;/*Sets the label weight as bold */
        }

        .field input {
            width: 100%; /*Sets the input width to fill the container */
            padding: 13px 14px;/*adds  space between the input */
            border: 1px solid var(--border);/*Sets the border color */
            border-radius: 9px;/*Sets the border radius */
            background: #fdfbf9;/*Sets the background color */
            font-family: inherit;  /*Sets the font */
            outline: none;/*Removes the outline and help to make border pink */
            font-size: 12px;/*Sets the font size */
            
        }
        
        .field input:focus {
            border-color: var(--pink);/*Sets the border color when the input is focused */
        }

        .field input::placeholder {
            color: #b9a9a8;/*Sets the placeholder color instead gray */
        }

        .form-options {  
            font-size: 11px;/*Sets the font size */
            margin: 0 0 22px;/*Sets the margin */
        }

        .remember {
        display: flex;/*arranges items in a row */
            align-items: center;/*Centers items in a vertical */
            gap: 6px;/*adds space between the checkbox and the label */
        }

        .remember input {
            accent-color: var(--pink);/*Sets the checkbox color */
        }


        .submit-btn {
            padding: 13px;/*adds inner spacing */
            border: none;/*Removes the border */
            border-radius: 9px;/*Sets the border radius */
            background: var(--pink);/*Sets the background color */
            color: white;/*Sets the text color */
             font-family: inherit;/*Sets the font */
            font-size: 14px;/*Sets the font size */
            font-weight: 700;/*Sets the font weight */
        }

        .submit-btn:hover {
            background: #985568;/*Sets the background color when the button is hovered */
        }
        /*footer style*/
        footer {
            text-align: center;
            padding: 0 15px 20px;
            color: #a89591;
            font-size: 11px;
        }

        /* For Mobile */
        @media (max-width: 760px) {
        
            .container {
                width: 95%;/*Sets the width */
                grid-template-columns: 1fr; /*Creates one column */
                margin: 10px auto 25px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .flower-mark {
                font-size: 140px;
            }
        }
    </style>
</head>
<body>
    /*navbar bar*/
    <header class="navbar">
        <div class="logo">FLOR</div>
        <div class="nav-note"> فلورا | أناقةٌ لمُناسباتك ..</div>
    </header>
    
    /*main content*/
    <main class="container">
        <section class="welcome">
            <h1>
                اخترنا الورد لنعبر عن شغفنا <br> ولنصنع لك تجربة تفوق الخيال<br>
            </h1>
            <div class="flower-mark">
                ✿✿✿✿
            </div>
        </section>
        <section class="form-section">
            <div class="form-heading">
                <h2>أهلًا بك في فلورا!</h2>
            </div>
            <div class="form-tabs">
                <button type="button" class="tab active">
                 تسجيل الدخول
                </button>
            </div>

            <form action="php/login.php" id="loginForm" method="post">
                <div class="field">
                    <label for="email">بريدك الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="example@outlook.sa" required>
                </div>
                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="أدخلي كلمة المرور" required>
                </div>
                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        تذكرني
                    </label>
                </div>
                <button type="submit" class="submit-btn">
                    أبدئي رحلتك معنا
                </button>
            </form>
        </section>
    </main>
    <footer>
        © 2026 فلورا. جميع الحقوق محفوظة.
        <br>
        ❣ Made with LoVe by Floar Team ❣
    </footer>
    <script src="script.js"></script>
</body>
</html>
