<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Flora | شكرًا لطلبك</title>
</html>
<style>
    body {
        background-color: #faf3f0;
        font-family: Tahoma ;
        text-align: center;
        padding-top: 100px;
        margin: 0;
        overflow: hidden;
    }

    .card {
        background-color: white;
        width: 350px;
        max-width: 80%;
        margin: auto;
        padding: 30px;
        border-radius: 20px;
        position: relative;
        z-index: 2;
    }

    h1 {
        color: #a47780;
        line-height: 1.8;
    }

    h2 {
        color: #a47780;
        font-size: 35px;
    }

    p {
        color: #806d70;
        line-height: 2;
    }

    a {
        display: inline-block;
        background-color: #a47780;
        color: white;
        padding: 12px 25px;
        border-radius: 20px;
        text-decoration: none;
        margin-top: 10px;
    }

    .bubble {
        position: fixed;
        bottom: -30px;
        width: 15px;
        height: 15px;
        background-color: #e8c5ce;
        border-radius: 50%;
        animation: move 6s infinite linear;
        z-index: 1;
    }

    @keyframes move {
        from {
            bottom: -30px;
        }

        to {
            bottom: 100%;
        }
    }
</style>

<div class="bubble" style="left: 5%; animation-delay: 0s;"></div>
<div class="bubble" style="left: 15%; animation-delay: 2s;"></div>
<div class="bubble" style="left: 25%; animation-delay: 4s;"></div>
<div class="bubble" style="left: 35%; animation-delay: 1s;"></div>
<div class="bubble" style="left: 45%; animation-delay: 3s;"></div>
<div class="bubble" style="left: 55%; animation-delay: 0.5s;"></div>
<div class="bubble" style="left: 65%; animation-delay: 2.5s;"></div>
<div class="bubble" style="left: 75%; animation-delay: 1.5s;"></div>
<div class="bubble" style="left: 85%; animation-delay: 3.5s;"></div>
<div class="bubble" style="left: 95%; animation-delay: 5s;"></div>

<div class="card">

    <h1>شكرًا لطلبك! </h1>

    <h2>✓</h2>

    <p>
        تم تجهيز طلبك بنجاح<br>ونحن سعداء جدًا باختيارك Flora.
    </p>

   
    <p>
       💗 شكرًا لثقتك بنا، ونتطلع لخدمتك مرة أخرى 💗
    </p>

    <a href="products.html">العودة للتسوق</a>

</div>
